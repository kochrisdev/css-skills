name: CSS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5-era commit
        with:
          python-version: ${{ matrix.python }}
      - name: Validate structure, integrity and workflow contracts
        run: python -m css validate
      - name: Run deterministic software tests
        run: python -m unittest discover -s tests -v
      - name: Run authored lexical retrieval smoke checks
        run: python -m css benchmark-routing

# This workflow has not run on GitHub in the package-generation session.
# Passing checks do not certify agent behavior or clear the public-release gate.
